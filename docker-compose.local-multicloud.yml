services:
  local-aws-simulator:
    image: traefik/whoami:v1.10
    restart: unless-stopped
    networks:
      - local_multicloud_net

  local-azure-simulator:
    image: traefik/whoami:v1.10
    restart: unless-stopped
    networks:
      - local_multicloud_net

  local-integration-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - local-aws-simulator
      - local-azure-simulator
    ports:
      - "${LOCAL_GATEWAY_PORT:-${LOCAL_MULTICLOUD_GATEWAY_PORT:-8089}}:80"
    environment:
      CLOUD_BACKEND_URL: ${CLOUD_BACKEND_URL:-http://host.docker.internal:8787}
      LOCAL_BACKEND_URL: ${LOCAL_BACKEND_URL:-http://host.docker.internal:8787}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./ops/local-multicloud/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - local_multicloud_net

  local-observability:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    profiles:
      - observability
    ports:
      - "${LOCAL_PROMETHEUS_PORT:-${LOCAL_MULTICLOUD_PROMETHEUS_PORT:-9091}}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./ops/local-multicloud/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - local_multicloud_net

networks:
  local_multicloud_net:
    name: local_multicloud_net
