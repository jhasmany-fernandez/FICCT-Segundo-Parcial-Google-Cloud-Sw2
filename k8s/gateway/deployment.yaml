apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ficct-emergencias
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: ficct-gateway:local
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: app-config
