apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ficct-emergencias
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ficct-frontend:local
          ports:
            - containerPort: 5656
