services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diagramador}
      POSTGRES_USER: ${POSTGRES_USER:-diagramador}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diagramador}
    ports:
      - "${POSTGRES_PORT:-5454}:5432"
    volumes:
      - postgres_data_observabilidad:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diagramador} -d ${POSTGRES_DB:-diagramador}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8787:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/uploads:/app/uploads
      - ./backend/firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "5656:5656"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  ms-ia-multimedia:
    build:
      context: ./services/ms-ia-multimedia
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8080
    ports:
      - "8090:8080"

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - ms-ia-multimedia

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3006:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  postgres_data_observabilidad:
